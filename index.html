<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-rulett – din side</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:#fff;font-family:"NRK Sans","Helvetica Neue",Arial,sans-serif;background:radial-gradient(ellipse at top,#16306b 0%,#0a1530 70%) fixed;
  display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:14px 16px 20px;font-size:16px}
.hd{display:flex;justify-content:space-between;align-items:center;opacity:.9;font-size:15px;margin-bottom:6px}
#pname{font-weight:800;color:#ffd23f;font-size:17px}
#ppl{background:#ffffff1c;border-radius:20px;padding:3px 12px;font-weight:700}
#pstat{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffd23f;font-weight:800;margin:6px 0 2px;min-height:16px}
#pq{font-size:22px;font-weight:800;line-height:1.25;margin:2px 0 12px}
.opt{display:block;background:#ffffff14;border:2px solid #ffffff33;border-radius:12px;padding:10px 14px;font-size:17px;margin-bottom:8px;transition:all .4s}
.opt b{display:inline-block;width:22px;color:#ffd23f}
.opt.right{background:#1c8a4a;border-color:#7dffb0}
.opt.wrong{opacity:.3}
.opt.picked{outline:2px solid #ffd23f;outline-offset:2px}
#pbanner{margin:10px 0;font-size:22px;font-weight:900;padding:14px;border-radius:14px;text-align:center}
#pbanner.turn{background:#ffd23f;color:#0a1530;animation:pulse 1s infinite}
#pbanner.good{background:#1c8a4a}
#pbanner.bad{background:#c0262d}
#pbanner.info{background:#ffffff18;font-size:16px;font-weight:700}
#ppen{font-size:17px;font-weight:800;color:#ffd23f;margin-bottom:8px;text-align:center}
#pcom{margin-top:auto;font-size:16px;font-style:italic;padding:12px 14px;border-left:5px solid #ffd23f;background:#ffffff0d;border-radius:8px}
#pcom small{display:block;font-style:normal;font-size:11px;opacity:.6;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
@keyframes pulse{50%{transform:scale(1.03)}}
</style>
</head>
<body>
<div class="hd"><div id="pname"></div><div id="ppl"></div></div>
<div id="pstat">Venter på start …</div>
<div id="pq"></div>
<div id="popts"></div>
<div id="pbanner" class="info">Spillet har ikke startet ennå.</div>
<div id="ppen"></div>
<div id="pcom"><small>Kommentatoren</small><span id="pctext">Her dukker kommentatoren opp når det braker løs.</span></div>
<script>
// Lenke: deltaker.html?p=<id>&n=<Fornavn>. Ingen navneliste her – kun id-nummer fra storskjermen.
const ROOM='julebord26-a14a543ca3';
const NTFY='https://ntfy.sh/'+ROOM;
const Q=new URLSearchParams(location.search);
const TEST=Q.has('test');
const PID=parseInt(Q.get('p'),10);
const MYNAME=(Q.get('n')||'').slice(0,40);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('pname').textContent=isNaN(PID)?'Ugyldig lenke':(MYNAME||'Deltaker');
const mine=()=>{try{return localStorage.getItem('jb26pen'+PID)||''}catch(e){return''}};
const who=(m)=>m.d===PID?'du':'en kollega';
const Cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function comment(m){
  const me=m.d===PID;let t=m.c||'';
  if(me) t=t.replace(/(på … |Det blir |bøyer seg for )\{N\}/g,'$1deg');
  t=t.replace(/\{N\}/g,me?'du':'en kollega');
  return t.replace(/(^|[.!?:] )([a-zæøå])/g,(a,b,c)=>b+c.toUpperCase());
}
function apply(m){
  const me=m.d===PID, isOut=(m.out||[]).includes(PID), W=who(m);
  $('ppl').textContent=m.ph==='w'?'👑':`${m.place}. plass`;
  $('pq').textContent=m.q||'';
  const showOpts=['q','s','d','r'].includes(m.ph);
  $('popts').innerHTML=showOpts?(m.o||[]).map((o,i)=>{
    let cls='opt';
    if(m.ph==='r'){cls+=(i===m.a?' right':' wrong');if(i===m.pk)cls+=' picked'}
    return `<div class="${cls}"><b>${'ABC'[i]}</b>${esc(o)}</div>`}).join(''):'';
  let st='',bn='',bc='info';const T=m.k==='t';
  if(m.ph==='q'){st='Nytt spørsmål';bn=isOut?'Du er ute – men heier videre 📣':'Hvem blir trukket? Tenk med!'}
  else if(m.ph==='s'){st='Rulletten snurrer …';bn='🎰 …'}
  else if(m.ph==='d'){st=me?'':'Trukket';bn=me?(T?'DIN TUR! Kom frem til tastaturet ⌨️':'DIN TUR! Svar til dommeren 🎤'):`${Cap(W)} ${T?'tar oppgaven':'svarer nå'}`;bc=me?'turn':'info';if(me&&navigator.vibrate)navigator.vibrate([300,100,300])}
  else if(m.ph==='r'){st='Fasit';bn=m.ok?(me?(T?'KLARTE DEN! Du er helten 🎉':'RIKTIG! Du er helten 🎉'):`${Cap(W)} ${T?'klarte oppgaven':'svarte riktig'} ✅`):(me?(T?'SVIKTET! 💥 Du er ute':'FEIL! 💥 Du er ute'):`${Cap(W)} ${T?'klarte ikke oppgaven':'svarte feil'} ❌`);bc=m.ok?'good':'bad';
    if(me&&!m.ok&&m.pen){try{localStorage.setItem('jb26pen'+PID,m.pen)}catch(e){}}}
  else if(m.ph==='w'){st='Vi er på toppen!';bn=me?'DET ER DEG! Du er årets julebords-konge 👑':'Vi har en julebords-konge! 👑 Se storskjermen';bc=me?'turn':'good'}
  $('pstat').textContent=st;$('pbanner').textContent=bn;$('pbanner').className=bc;
  $('ppen').textContent=(isOut||(me&&m.ph==='r'&&!m.ok))?(m.ph==='r'&&me&&!m.ok?m.pen:mine()):'';
  if(m.c)$('pctext').textContent=comment(m);
}
window.__apply=apply;
if(!TEST&&!isNaN(PID)){
  let last=0;
  const es=new EventSource(NTFY+'/sse?since=latest');
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event&&d.event!=='message')return;const m=JSON.parse(d.message);if(m.t>=last){last=m.t;apply(m)}}catch(x){}};
  es.onerror=()=>{if($('pbanner').textContent.startsWith('Spillet har'))$('pbanner').textContent='Kobler til …'};
}
</script>
</body>
</html>
